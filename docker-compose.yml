services:
  stratus-api:
    build:
      context: ./services/api
    environment:
      AWS_PROFILE_NILKAMAL: ${AWS_PROFILE_NILKAMAL:-nilkamal}
      AWS_PROFILE_GCPL: ${AWS_PROFILE_GCPL:-gcpl}
      AWS_PROFILE_SWASTIKS: ${AWS_PROFILE_SWASTIKS:-swastiks}
      AWS_PROFILE_FUSION: ${AWS_PROFILE_FUSION:-fusion}
      AWS_REGION: ap-south-1
      BILLING_DATA_DIR: /data
    volumes:
      - type: bind
        source: ${AWS_CONFIG_DIR:?Set AWS_CONFIG_DIR to the host .aws directory}
        target: /home/node/.aws
        read_only: true
      - type: volume
        source: stratus-billing-data
        target: /data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:4000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  stratus-web:
    build:
      context: .
    environment:
      STRATUS_API_URL: http://stratus-api:4000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini}
    depends_on:
      stratus-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  stratus-billing-data:
